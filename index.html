<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopify - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="login-page" class="login-page">
    <section class="login-brand">
      <a class="brand-mark" href="index.html">Kopify</a>
      <div class="brand-content">
        <span class="coffee-icon" aria-hidden="true">☕</span>
        <p>Where every cup tells a story.</p>
      </div>
    </section>

    <section class="login-panel" aria-labelledby="login-title">
      <form class="login-card" action="dashboard.html">
        <p class="eyebrow">POINT OF SALE</p>
        <h1 id="login-title">Selamat datang</h1>
        <p class="muted">Masuk untuk mengelola transaksi Kopify.</p>

        <label for="username">Email / Username</label>
        <input id="username" name="username" type="text" placeholder="Masukkan email atau username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Masukkan password" required>

        <div class="login-options">
          <label class="checkbox-label">
            <input type="checkbox" name="remember">
            <span>Ingat saya</span>
          </label>
          <a href="#login-page">Lupa password?</a>
        </div>

        <button class="primary-button" type="submit">Masuk ke Kasir</button>
      </form>
    </section>
  </main>
</body>
</html>
