<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopify</title>    
    <link rel="icon" href="/assets/kopify-main-logo.png" type="image/png">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div id="root">
        <main class="login-shell">
            <section class="login-visual">
                <div class="logo logo-light">
                    <img class="logo-mark" alt="" src="../assets/kopify-main-logo.png">
                    <span>KOPIFY</span>
                </div>
                <img class="hero-logo" alt="Logo Kopify, gelas kopi tersenyum" src="../assets/kopify-main-logo.png">
                <p class="tagline">Where Every Cup<br>Tells a Story.</p>
            </section>
            <section class="login-panel">
                <form class="login-card">
                    <div class="brand-title"><span>K</span>opify</div>
                    <p>Teman operasional kedai kamu.</p>
                    <label>Email<input required="" type="email" value="admin@kopify.id"></label>
                    <label>Password<div class="password-wrap"><input required="" type="password" value="kopify123"><button type="button" aria-label="Tampilkan password">Show</button></div></label>
                    <div class="login-options">
                        <label><input type="checkbox"> Ingat saya</label>
                        <button type="button">Lupa password?</button>
                    </div>
                    <button class="primary-button" type="submit"><a href="../index.html">Masuk sebagai Kasir</a></button>
                    <button class="secondary-button" type="button"><a href="../index.html">Masuk sebagai Owner</a></button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
